name: 📰 AI信息差 - 每日飞书推送

on:
  schedule:
    # 早上 08:00 北京时间 (UTC 00:00)
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ai-news-daily
  cancel-in-progress: false

jobs:
  run-pipeline:
    name: 抓取 → 分析 → wewrite排版 → 推飞书
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Asia/Shanghai

    steps:
      - name: 检出代码
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 设置 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 检查必要 Secrets
        run: |
          missing=0
          for key in OPENAI_API_KEY OPENAI_BASE_URL LLM_MODEL FEISHU_WEBHOOK_URL; do
            if [ -z "${!key}" ]; then
              echo "❌ 缺少必填 Secret: $key"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          echo "✅ 必填 Secrets 已就绪"
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}

      - name: 安装依赖
        run: |
          pip install -r ai-news-assistant/requirements.txt
          pip install python-dotenv markdown pyyaml cssutils

      - name: 创建 .env 文件
        run: |
          cat > ai-news-assistant/.env << 'ENVEOF'
          OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL=${{ secrets.OPENAI_BASE_URL }}
          LLM_MODEL=${{ secrets.LLM_MODEL }}
          FEISHU_WEBHOOK_URL=${{ secrets.FEISHU_WEBHOOK_URL }}
          WEWRITE_THEME=${{ secrets.WEWRITE_THEME }}
          ENVEOF
          echo "✅ .env 文件已创建"

      - name: 运行 AI 信息差流水线
        run: |
          cd ai-news-assistant
          if [ -n "${FEISHU_WEBHOOK_URL}" ]; then
            ./run.sh --feishu 2>&1
          else
            ./run.sh 2>&1
          fi
          echo "✅ 流水线执行完毕"
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          WEWRITE_THEME: ${{ secrets.WEWRITE_THEME }}

      - name: 校验抓取结果
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from datetime import datetime

          today = datetime.now().strftime("%Y-%m-%d")
          report_path = Path("ai-news-assistant/data") / f"report_{today}.json"
          if not report_path.exists():
              raise SystemExit(f"未找到执行报告: {report_path}")

          report = json.loads(report_path.read_text(encoding="utf-8"))
          fetch_count = report.get("抓取数量", 0)
          errors = report.get("错误摘要", [])
          articles = report.get("生成文章", [])
          article_count = len(report.get("生成文章", []))
          llm_status = report.get("模型状态", {})
          publish_status = report.get("发布状态", "")

          print(f"抓取数量: {fetch_count}")
          print(f"文章数量: {article_count}")
          print(f"错误摘要: {len(errors)} 条")
          print(f"模型状态: {llm_status}")
          print(f"发布状态: {publish_status}")

          if fetch_count == 0 and errors:
              raise SystemExit("抓取结果为 0 且存在源站错误，判定为异常失败")
          if len(articles) != 1:
              raise SystemExit(f"AI 信息差应生成 1 篇，实际为 {len(articles)}")
          if llm_status.get("mode") == "fallback":
              raise SystemExit(f"模型调用进入降级模式: {llm_status.get('errors', [])}")
          if "飞书推送成功" not in publish_status:
              raise SystemExit(f"AI 飞书推送失败: {publish_status}")
          PY

      - name: 上传生成的文章
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ai-news-articles
          path: |
            ai-news-assistant/output/
            ai-news-assistant/data/
          retention-days: 7
