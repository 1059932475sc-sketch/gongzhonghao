name: 📰 AI资讯情报官 - 每日自动运行

on:
  schedule:
    # 每天早上 8:00 北京时间 (UTC 0:00)
    - cron: '0 0 * * *'
  # 也可以手动触发
  workflow_dispatch:

jobs:
  run-pipeline:
    name: 抓取 → 分析 → 生成 → 推飞书
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装依赖
        run: |
          pip install -r ai-news-assistant/requirements.txt
          pip install python-dotenv

      - name: 创建 .env 文件
        run: |
          cat > ai-news-assistant/.env << 'ENVEOF'
          OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL=${{ secrets.OPENAI_BASE_URL }}
          LLM_MODEL=${{ secrets.LLM_MODEL }}
          FEISHU_WEBHOOK_URL=${{ secrets.FEISHU_WEBHOOK_URL }}
          ENVEOF
          echo "✅ .env 文件已创建"

      - name: 运行情报流水线（推送到飞书）
        run: |
          cd ai-news-assistant
          python3 main.py --feishu 2>&1
          echo "✅ 流水线执行完毕"
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}

      - name: 上传生成的文章
        uses: actions/upload-artifact@v4
        with:
          name: ai-news-articles
          path: ai-news-assistant/output/
          retention-days: 7
