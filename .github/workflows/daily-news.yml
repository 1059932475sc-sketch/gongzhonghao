name: 📰 AI资讯情报官 - 每日自动运行

on:
  schedule:
    # 早上 8:00 北京时间 (UTC 0:00)
    - cron: '0 0 * * *'
    # 仅早上 8:00 运行一次
  # 也可以手动触发
  workflow_dispatch:

jobs:
  run-pipeline:
    name: 抓取 → 分析 → 生成 → 推飞书
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 检查今日是否已运行（去重锁）
        id: check_run
        run: |
          if [ -f ai-news-assistant/.last-run ]; then
            LAST_RUN=$(cat ai-news-assistant/.last-run)
            TODAY=$(date +%Y-%m-%d)
            if [ "$LAST_RUN" = "$TODAY" ]; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "✅ 今日 ($TODAY) 已运行过，跳过本次"
            else
              echo "skip=false" >> "$GITHUB_OUTPUT"
              echo "📅 上次运行: $LAST_RUN，今日尚未运行，继续执行"
            fi
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "📅 暂无运行记录，继续执行"
          fi

      - name: 跳过（今日已运行）
        if: steps.check_run.outputs.skip == 'true'
        run: echo "✅ 跳过" && exit 0

      - name: 设置 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装依赖
        run: |
          pip install -r ai-news-assistant/requirements.txt
          pip install python-dotenv

      - name: 创建 .env 文件
        run: |
          cat > ai-news-assistant/.env << 'ENVEOF'
          OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL=${{ secrets.OPENAI_BASE_URL }}
          LLM_MODEL=${{ secrets.LLM_MODEL }}
          FEISHU_WEBHOOK_URL=${{ secrets.FEISHU_WEBHOOK_URL }}
          ENVEOF
          echo "✅ .env 文件已创建"

      - name: 运行情报流水线（推送到飞书）
        run: |
          cd ai-news-assistant
          python3 main.py --feishu 2>&1
          echo "✅ 流水线执行完毕"
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}

      - name: 记录今日运行时间戳
        if: success()
        run: |
          date +%Y-%m-%d > ai-news-assistant/.last-run
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ai-news-assistant/.last-run
          git commit -m "chore: update last-run date [skip ci]"
          git push

      - name: 上传生成的文章
        uses: actions/upload-artifact@v7
        with:
          name: ai-news-articles
          path: ai-news-assistant/output/
          retention-days: 7
